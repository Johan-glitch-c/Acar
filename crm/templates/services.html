{%load static %}


<section id="services" class="services">

    <div class="container">

        <div class="section-title">

            <h2>Наши услуги</h2>

            <p>
                Выберите подходящую услугу. Стоимость рассчитывается индивидуально в зависимости от сложности
                проекта.
            </p>

        </div>

        <div class="services-grid">

            {% for service in services %}

            <div class="service-card">

                <div class="icon-box">
                    <img src="{{ service.image.url }}" class="service-icon" alt="{{ service.name }}">
                </div>

                <h3>{{ service.title }}</h3>

                <p>{{ service.desc }}</p>

                <a href="#contact" class="service-btn">
                    Əlaqə saxla
                </a>

            </div>

            {% endfor %}
        </div>

    </div>

    </div>

</section>
